<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Window Seat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <main class="stage">
        <div class="window-frame">
          <div class="window-outer">
            <div class="window-inner">
              <div class="window-glass" id="sky-root"></div>
              <div class="glass-sheen" aria-hidden="true"></div>
              <div
                class="window-shade"
                id="window-shade"
                role="slider"
                aria-label="Window shade"
                aria-valuemin="0"
                aria-valuemax="1"
                aria-orientation="vertical"
                tabindex="0"
              >
                <div class="shade-panel" aria-hidden="true"></div>
                <div class="shade-handle" aria-hidden="true">
                  <span class="shade-grip"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="ui-root"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
